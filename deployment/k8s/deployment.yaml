apiVersion: v1
kind: Namespace
metadata:
  name: leadforgeai
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: leadforge-config
  namespace: leadforgeai
data:
  ENV: "production"
  APP_NAME: "LeadForgeAI Enterprise"
  APP_VERSION: "14.0.0"
  MONGODB_URL: "mongodb://leadforge-mongodb:27017/leadforge_db"
  REDIS_URL: "redis://leadforge-redis:6379/0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: leadforge-backend
  namespace: leadforgeai
  labels:
    app: leadforge-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: leadforge-backend
  template:
    metadata:
      labels:
        app: leadforge-backend
    spec:
      containers:
        - name: backend
          image: leadforgeai/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: leadforge-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: leadforge-backend-service
  namespace: leadforgeai
spec:
  selector:
    app: leadforge-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: leadforge-frontend
  namespace: leadforgeai
  labels:
    app: leadforge-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: leadforge-frontend
  template:
    metadata:
      labels:
        app: leadforge-frontend
    spec:
      containers:
        - name: frontend
          image: leadforgeai/frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: leadforge-frontend-service
  namespace: leadforgeai
spec:
  selector:
    app: leadforge-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

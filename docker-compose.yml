services:

  mongodb:
    image: mongo:6.0
    container_name: leadforge_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-leadforge}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-leadforge_password}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-leadforge_db}
    volumes:
      - mongodb_data:/data/db
      - ./database/mongo/seed:/docker-entrypoint-initdb.d:ro
    networks:
      - leadforge_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: leadforge_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - leadforge_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  mongo_express:
    image: mongo-express:latest
    container_name: leadforge_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-leadforge}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-leadforge_password}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-leadforge}:${MONGO_ROOT_PASSWORD:-leadforge_password}@mongodb:27017/${MONGO_DB_NAME:-leadforge_db}?authSource=admin
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - leadforge_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:8081/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: leadforge_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGODB_URL: mongodb://${MONGO_ROOT_USER:-leadforge}:${MONGO_ROOT_PASSWORD:-leadforge_password}@mongodb:27017/${MONGO_DB_NAME:-leadforge_db}?authSource=admin
      REDIS_URL: redis://redis:6379/0
      ENV: development
      DEBUG: "true"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - leadforge_network
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
      - ./backend/reports:/app/reports
      - ./backend/exports:/app/exports
      - ./backend/screenshots:/app/screenshots
      - ./backend/logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  celery_worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: leadforge_celery_worker
    restart: unless-stopped
    command: celery -A app.tasks.worker worker --loglevel=info
    environment:
      MONGODB_URL: mongodb://${MONGO_ROOT_USER:-leadforge}:${MONGO_ROOT_PASSWORD:-leadforge_password}@mongodb:27017/${MONGO_DB_NAME:-leadforge_db}?authSource=admin
      REDIS_URL: redis://redis:6379/0
      ENV: development
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - leadforge_network
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.worker inspect ping || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
      target: development
    container_name: leadforge_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - leadforge_network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: leadforge_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - leadforge_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mongodb_data:
    name: leadforge_mongodb_data
  redis_data:
    name: leadforge_redis_data

networks:
  leadforge_network:
    name: leadforgeai_leadforge_network
    driver: bridge
